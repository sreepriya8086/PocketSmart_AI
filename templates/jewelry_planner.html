{% extends 'base.html' %}{% block content %}<div class="formbox"><h2>💎 Jewelry Planner</h2><form method="post" action="/generate/jewelry" enctype="multipart/form-data"><label>Budget (₹)</label><input id="budget" name="budget" type="number" min="1" required><input id="occasion" placeholder="Occasion" required><input id="style" placeholder="Preferred style"><label>Optional outfit image</label><input name="image" type="file" accept="image/*"><input type="hidden" name="data" id="data"><button type="submit" onclick="pack()">Generate Plan</button></form></div><script>function pack(){data.value=JSON.stringify({occasion:occasion.value,style:style.value})}</script>{% endblock %}
