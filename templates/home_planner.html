{% extends 'base.html' %}{% block content %}<div class="formbox"><h2>🏠 Home Interior Planner</h2><form method="post" action="/generate/home"><label>Budget (₹)</label><input id="budget" name="budget" type="number" min="1" required><input id="room" placeholder="Room type (e.g. Living Room)" required><input id="style" placeholder="Style (e.g. modern)"><input id="items" placeholder="Items needed (e.g. sofa, lights, table)"><input type="hidden" name="data" id="data"><button type="submit" onclick="packHome()">Generate Plan</button></form></div><script>function packHome(){data.value=JSON.stringify({room:room.value,style:style.value,items:items.value})}</script>{% endblock %}
