{% extends 'base.html' %}{% block content %}<div class="formbox"><h2>🎉 Party Planner</h2><form method="post" action="/generate/party"><label>Budget (₹)</label><input id="budget" name="budget" type="number" min="1" required><input id="event" placeholder="Event type (birthday, wedding, corporate)" required><input id="guests" type="number" placeholder="Guest count" required><input id="venue" placeholder="Venue preference"><input type="hidden" name="data" id="data"><button type="submit" onclick="pack()">Generate Plan</button></form></div><script>function pack(){data.value=JSON.stringify({event:event.value,guests:guests.value,venue:venue.value})}</script>{% endblock %}
