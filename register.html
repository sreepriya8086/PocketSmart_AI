{% extends "base.html" %}
{% block title %}Create Account — PocketSmart AI{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="eyebrow">POCKETSMART AI</div>
  <h1>Create your account</h1>
  <p>Save plans and access your recommendation history.</p>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post" class="form">
    <label>Email<input name="email" type="email" placeholder="you@example.com" required></label>
    <label>Password<input name="password" type="password" minlength="6" placeholder="At least 6 characters" required></label>
    <button class="btn primary" type="submit">Create Account</button>
  </form>
  <p class="muted">Already registered? <a href="/login">Login</a></p>
</div>
{% endblock %}
